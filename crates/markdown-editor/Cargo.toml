[package]
name = "gpui-markdown-editor"
description = "A Typora-style live Markdown editor component for GPUI Kit: tree-sitter analysis, concealed syntax, inline rendering. Extracted from the abstract notes app."
keywords = ["gpui", "markdown", "editor", "wysiwyg"]
license = "Apache-2.0"
version = "0.7.3"
publish = false
edition.workspace = true
repository = "https://github.com/sxhxliang/gpui-kit"

[lib]
doctest = false

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
# Same facade feature set abstract builds against: the styled component
# library (PopupMenu, highlighter) plus the Markdown grammars its
# highlighter needs for fenced blocks.
gpui-kit = { workspace = true, features = ["tree-sitter-markdown", "tree-sitter-markdown-inline"] }
tree-sitter = "=0.26.13"
tree-sitter-md = "=0.5.3"
unicode-segmentation = "1"
unicode-width = "0.2"
# Figure rendering: LaTeX through RaTeX, diagrams through pure-Rust
# Mermaid/PlantUML renderers; SVG output rasterized with resvg.
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
plantuml-little = { version = "=1.2026.2-4", default-features = false, features = ["metrics-ttf-parser"] }
resvg = "0.46"
usvg = "0.46"
tiny-skia = "0.11"
image = "0.25"
omgkit-depict = "=0.0.8"
omgkit-io = "=0.0.8"
omgkit-chem = "=0.0.8"
omgkit-core = "=0.0.8"
ttf-parser = "0.21"
